<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Login</title>
  
  <link rel="stylesheet" href="css/register.css"> <!-- हम रजिस्टर वाली CSS ही इस्तेमाल करेंगे ताकि डिज़ाइन सेम रहे -->

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="card" id="loginCard">
    <div class="logo-box">
      <img src="images/logo.png" alt="Logo" class="app-logo">
    </div>

    <h2 class="team-title">Coordinator Login</h2>
    
    <form id="loginForm">
      <label>Mobile Number (User ID):</label>
      <input type="tel" id="loginMobile" placeholder="Enter 10-digit Mobile Number" pattern="[0-9]{10}" title="कृपया 10 अंकों का मोबाइल नंबर डालें" required>

      <label>Password (4-Digit PIN):</label>
      <input type="password" id="loginPass" placeholder="Enter 4-digit PIN" pattern="[0-9]{4}" maxlength="4" title="कृपया सिर्फ 4 अंकों का पासवर्ड (PIN) डालें" required>

      <button type="submit" class="btn btn-blue">Login</button>
      
      <p class="login-link-text">
        New Coordinator? <a href="register.html">Register here</a>
      </p>
    </form>
    
    <div id="loginMsg" class="error-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>

  <!-- Javascript File Link -->
  <script src="js/login.js"></script>
</body>
</html>
