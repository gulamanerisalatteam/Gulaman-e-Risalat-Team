<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Collection App</title>
  
  <!-- नया प्रीमियम CSS लिंक -->
  <link rel="stylesheet" href="css/index.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- 1. PREMIUM LOGIN SCREEN -->
  <div class="card" id="loginCard">
    
    <!-- टीम का नाम (नयी क्लास के साथ) -->
    <h2 class="team-title">Gulaman-e-Risalat Team</h2>

    <!-- लोगो (अब कटेगा नहीं) -->
    <div class="logo-box">
      <img src="images/logo.png" alt="Logo" class="app-logo">
    </div>

    <!-- हेडिंग -->
    <h3 class="login-subtitle">Admin / Other Login</h3>
    
    <form id="loginForm">
      <label>User ID:</label>
      <input type="text" id="userId" placeholder="Enter User ID" required>

      <label>Password:</label>
      <input type="password" id="userPass" placeholder="Enter Password" required>

      <button type="submit" class="btn btn-blue">Login</button>

      <!-- नया रजिस्ट्रेशन लिंक -->
      <p class="register-link-text">
        new Cordinator? <a href="register.html">Register Here</a>
      </p>
    </form>
    <div id="loginMsg" class="error-msg"></div>
  </div>

  <!-- 2. COLLECTION FORM SCREEN -->
  <div class="card hidden" id="collectionCard">
    <div class="header-bar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
      <div style="font-weight: bold; color: #444;">Cordinator: <strong id="currentEmp" style="color: #007bff;"></strong></div>
      <button id="logoutBtn" style="background:#dc3545; color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:bold;">Logout</button>
    </div>

    <div class="logo-box">
      <img src="images/logo.png" alt="Logo" class="app-logo" style="width: 70px;">
    </div>

    <h2 class="team-title" style="font-size: 20px;">Payment Entry</h2>
    <form id="collectionForm">
      <label>Customer Name:</label>
      <input type="text" id="custName" placeholder="ग्राहक का नाम" required>

      <label>Customer Mobile:</label>
      <input type="tel" id="custMobile" placeholder="मोबाइल नंबर (वैकल्पिक)">

      <label>Amount Collected (₹):</label>
      <input type="number" id="amount" placeholder="रकम (₹)" required>

      <label>Payment Mode:</label>
      <select id="payMode" required>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI / PhonePe / GPay</option>
        <option value="Cheque">Cheque</option>
      </select>

      <label>Remarks / Notes:</label>
      <textarea id="remarks" rows="2" placeholder="कोई खास विवरण..."></textarea>

      <button type="submit" class="btn btn-green" id="submitBtn">Save Entry</button>
    </form>
    <div id="statusMsg" class="error-msg"></div>
  </div>

  <!-- JS Folder Path -->
  <script src="js/script.js"></script>
</body>
</html>
