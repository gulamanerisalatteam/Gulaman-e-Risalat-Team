<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gulaman-e-Risalat Team</title>
  
  <link rel="stylesheet" href="css/register.css"> 

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body style="background: #f4f7fa;">

  <div class="card" id="loginCard" style="margin-top: 50px;">
    
    <!-- Logo -->
    <div class="logo-box">
      <img src="images/logo.png" alt="Logo" class="app-logo">
    </div>

    <!-- Main Headings -->
    <h2 class="team-title" style="margin-bottom: 5px;">Gulaman-e-Risalat Team</h2>
    <h3 style="text-align: center; color: #555; font-size: 16px; margin-top: 0; margin-bottom: 25px;">Admin / Cordinator Login</h3>
    
    <form id="loginForm">
      <!-- Email ID / Mobile Number -->
      <label>Email ID / Mobile Number</label>
      <input type="text" id="loginId" placeholder="Enter Email or Mobile Number" required>

      <!-- Password -->
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter Password" required>

      <!-- Login Button -->
      <button type="submit" class="btn btn-blue">Login</button>
      
      <!-- Register Here Link -->
      <p class="login-link-text">
        <a href="register.html" style="font-weight: bold; font-size: 15px;">Register Here</a>
      </p>
    </form>
    
    <div id="loginMsg" class="error-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>

  <!-- Javascript File Link -->
  <script src="js/login.js"></script>
</body>
</html>
