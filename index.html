<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gulaman-e-Risalat</title>
  
  <link rel="stylesheet" href="css/register.css"> 

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body style="background: #f4f7fa;">

  <div class="card" id="loginCard" style="margin-top: 50px;">
    <div class="logo-box">
      <img src="images/logo.png" alt="Logo" class="app-logo">
    </div>

    <h2 class="team-title">Team Login</h2>
    
    <form id="loginForm">
      <!-- Email aur Mobile dono support karne ke liye type="text" -->
      <label>Email ID / Mobile Number:</label>
      <input type="text" id="loginId" placeholder="Enter Admin Email or Coordinator Mobile" required>

      <!-- Password ki limit hata di gayi hai taki admin apna password daal sake -->
      <label>Password / 4-Digit PIN:</label>
      <input type="password" id="loginPass" placeholder="Enter Password or PIN" required>

      <button type="submit" class="btn btn-blue">Login</button>
      
      <p class="login-link-text">
        New Coordinator? <a href="register.html">Register here</a>
      </p>
    </form>
    
    <div id="loginMsg" class="error-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>

  <!-- Javascript File Link -->
  <script src="js/login.js"></script>
</body>
</html>
