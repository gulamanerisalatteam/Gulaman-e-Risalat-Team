<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Collection App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div class="card" id="loginCard">
    <h2>Employee Login</h2>
    <form id="loginForm">
      <label>User ID:</label>
      <input type="text" id="userId" placeholder="Enter User ID" required>

      <label>Password:</label>
      <input type="password" id="userPass" placeholder="Enter Password" required>

      <button type="submit" class="btn btn-blue">Login</button>
    </form>
    <div id="loginMsg" class="error-msg"></div>
  </div>

  <!-- 2. COLLECTION FORM SCREEN (Default Hidden) -->
  <div class="card hidden" id="collectionCard">
    <div class="header-bar">
      <div>कर्मचारी: <strong id="currentEmp"></strong></div>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>

    <h2>Payment Entry</h2>
    <form id="collectionForm">
      <label>Customer Name:</label>
      <input type="text" id="custName" placeholder="ग्राहक का नाम" required>

      <label>Customer Mobile:</label>
      <input type="tel" id="custMobile" placeholder="मोबाइल नंबर (Optional)">

      <label>Amount Collected (₹):</label>
      <input type="number" id="amount" placeholder="रकम (₹)" required>

      <label>Payment Mode:</label>
      <select id="payMode" required>
        <option value="Cash">Cash (नकद)</option>
        <option value="UPI / Online">UPI / PhonePe / GPay</option>
        <option value="Cheque">Cheque</option>
      </select>

      <label>Remarks / Note:</label>
      <textarea id="remarks" rows="2" placeholder="कोई खास विवरण..."></textarea>

      <button type="submit" class="btn btn-green" id="submitBtn">Save Entry</button>
    </form>
    <div id="statusMsg"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
