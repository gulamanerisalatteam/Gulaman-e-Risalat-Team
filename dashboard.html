<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  
  <link rel="stylesheet" href="css/admin.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- LEFT SIDEBAR (Ab JavaScript se load hoga) -->
  <div id="sidebar-container"></div>

  <!-- RIGHT MAIN CONTENT -->
  <div class="main-content">
    <h1 class="page-title">Dashboard Overview</h1>

    <div class="summary-card">
      <h3>Total Collection</h3>
      <h2 id="totalAmount">₹0</h2>
    </div>

    <div class="table-card">
      <h2 style="font-size: 20px; color: #333; margin-bottom: 15px;">Recent Payments</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Coordinator</th>
              <th>Customer</th>
              <th>Mode</th>
              <th>Amount (₹)</th>
            </tr>
          </thead>
          <tbody id="paymentTableBody">
            <tr>
              <td colspan="5" style="text-align: center;">Loading data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Scripts (Pehle sidebar, phir dashboard) -->
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
