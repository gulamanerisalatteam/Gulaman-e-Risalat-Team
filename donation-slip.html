<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Donation Slip</title>
  
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
    
    .container { padding: 20px; max-width: 500px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    .user-welcome { text-align: center; color: #0056b3; margin-bottom: 20px; font-weight: bold; font-size: 16px; border-bottom: 2px dashed #eee; padding-bottom: 10px; }
    
    label { font-weight: bold; color: #333; margin-top: 10px; display: block; font-size: 14px; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
    
    .btn-submit { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background: #218838; }
    
    /* Receipt Styles */
    #receiptCard { display: none; }
    .receipt-box { border: 2px dashed #0056b3; padding: 20px; border-radius: 10px; background: #fff; margin-bottom: 15px; }
    .receipt-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
    
    .btn-share { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .btn-new { background: #6c757d; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <!-- Image Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- MOBILE SIDEBAR CONTAINER -->
  <div id="coord-sidebar-container"></div>

  <div class="container">
    
    <!-- FORM SECTION -->
    <div class="card" id="formCard">
      <div class="user-welcome" id="welcomeUser">Loading User...</div>
      
      <form id="donationForm">
        <label>Donator Name *</label>
        <select id="donorName" required>
          <option value="" disabled selected>Loading Donors...</option>
        </select>

        <label>Month & Year *</label>
        <input type="month" id="monthYear" required>

        <label>Amount (₹) *</label>
        <input type="number" id="donationAmount" placeholder="Enter Amount" required>

        <label>Donor Type *</label>
        <select id="donorType" required>
          <option value="Box">Box</option>
          <option value="Without Box">Without Box</option>
        </select>

        <button type="submit" class="btn-submit">Submit Data</button>
      </form>
      <div id="donationMsg" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- RECEIPT SECTION -->
    <div class="card" id="receiptCard">
      <div class="receipt-box" id="receiptContent">
        <div style="text-align: center; margin-bottom: 15px;">
          <img src="images/logo.png" alt="Logo" style="width: 60px; display: block; margin: 0 auto 5px auto;" onerror="this.style.display='none'">
          <h3 style="color: #0056b3; margin: 0;">Gulaman-e-Risalat Team</h3>
          <p style="margin: 5px 0 0 0; font-size: 14px; color: #555; font-weight: bold;">Monthly Donation Receipt</p>
        </div>
        
        <div class="receipt-row"><strong>Name:</strong> <span id="rName"></span></div>
        <div class="receipt-row"><strong>Month/Year:</strong> <span id="rMonth"></span></div>
        <div class="receipt-row"><strong>Amount:</strong> <span style="color: #28a745; font-weight: bold;">₹ <span id="rAmount"></span></span></div>
        <div class="receipt-row"><strong>Type:</strong> <span id="rType"></span></div>
        <div class="receipt-row"><strong>Collected By:</strong> <span id="rCoord"></span></div>
        <div class="receipt-row" style="border-bottom: none;"><strong>Date:</strong> <span id="rDate"></span></div>
      </div>

      <button onclick="shareReceipt()" class="btn-share">📤 Share Receipt Image</button>
      <button onclick="showFormAgain()" class="btn-new">➕ Make Another Slip</button>
    </div>

  </div>

  <!-- JavaScript Links -->
  <script src="js/coord-sidebar.js"></script>
  <script src="js/donation.js"></script>
</body>
</html>
