<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Details - Admin Panel</title>
  
  <!-- आपकी प्रीमियम CSS -->
  <link rel="stylesheet" href="css/index.css">
  
  <style>
    /* सिर्फ इस टेबल के लिए खास CSS */
    .dashboard-wrapper {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .table-card {
      background-color: #ffffff;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    .table-card h2 {
      text-align: left;
      font-size: 22px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px; /* मोबाइल में स्क्रॉल करने के लिए */
    }

    th, td {
      padding: 15px 12px;
      text-align: left;
      border-bottom: 1px solid #e1e5eb;
      font-size: 14px;
      color: #333;
    }

    th {
      background-color: #f8f9fa;
      color: #555;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-pending { color: #f39c12; font-weight: bold; background: #fdf3e5; padding: 4px 8px; border-radius: 4px; }
    .status-approved { color: #28a745; font-weight: bold; background: #e6f6ea; padding: 4px 8px; border-radius: 4px; }
    .status-rejected { color: #dc3545; font-weight: bold; background: #fbeae9; padding: 4px 8px; border-radius: 4px; }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 5px;
      transition: all 0.2s ease;
    }
    
    .btn-approve { background-color: #28a745; }
    .btn-approve:hover { background-color: #218838; transform: translateY(-1px); box-shadow: 0 4px 8px rgba(40,167,69,0.2); }
    
    .btn-reject { background-color: #dc3545; }
    .btn-reject:hover { background-color: #c82333; transform: translateY(-1px); box-shadow: 0 4px 8px rgba(220,53,69,0.2); }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Header -->
    <div class="card" style="padding: 15px 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; max-width: 100%;">
      <div style="font-weight: bold; font-size: 18px; color: #444;">Admin Panel <span style="color: #007bff;">| Approvals</span></div>
      <button onclick="window.location.href='dashboard.html'" style="background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">Back to Dashboard</button>
    </div>

    <!-- Data Table -->
    <div class="table-card">
      <h2 class="team-title">New Coordinator Registrations</h2>
      
      <table>
        <thead>
          <tr>
            <th>S. No.</th>
            <th>Full Name</th>
            <th>Mobile Number</th>
            <th>Aadhar Card Number</th>
            <th>Date of Birth</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="coordinatorTableBody">
          
          <!-- यह एक डमी (Demo) डेटा है, बाद में इसे Firebase से जोड़ेंगे -->
          <tr>
            <td>1</td>
            <td><strong style="color: #0056b3;">Amaan Khan</strong></td>
            <td>9876543210</td>
            <td>XXXX-XXXX-XXXX</td>
            <td>15/08/1998</td>
            <td><span class="status-pending">Pending</span></td>
            <td style="white-space: nowrap;">
              <button class="action-btn btn-approve">Approve</button>
              <button class="action-btn btn-reject">Reject</button>
            </td>
          </tr>
          
        </tbody>
      </table>
    </div>
  </div>

  <!-- JS Code for Firebase will come here later -->
  <!-- <script src="js/approvals.js"></script> -->
</body>
</html>
