<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Details - Admin Panel</title>
  
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* Status Labels */
    .status-pending { color: #f39c12; background: #fdf3e5; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    .status-approved { color: #28a745; background: #e6f6ea; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    .status-rejected { color: #dc3545; background: #fbeae9; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    
    /* Action Buttons */
    .btn-approve { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 5px; }
    .btn-pending { background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 5px; }
    .btn-delete { background: #343a40; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR (JavaScript se load hoga) -->
  <div id="sidebar-container"></div>

  <!-- RIGHT MAIN CONTENT -->
  <div class="main-content">
    <h1 class="page-title">Coordinator Approvals</h1>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>S. No.</th>
            <th>Full Name</th>
            <th>Mobile Number</th>
            <th>Aadhar Card Number</th>
            <th>Date of Birth</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="coordinatorTableBody">
          <!-- डमी (Demo) डेटा -->
          <tr>
            <td>1</td>
            <td><strong style="color: #0056b3;">Amaan Khan</strong></td>
            <td>9876543210</td>
            <td>XXXX-XXXX-XXXX</td>
            <td>15/08/1998</td>
            <td><span class="status-pending">Pending</span></td>
            <td style="white-space: nowrap;">
              <button class="btn-approve">Approve</button>
              <button class="btn-pending">Pending</button>
              <button class="btn-delete">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/sidebar.js"></script>
  <!-- <script src="js/approvals.js"></script> -->
</body>
</html>
